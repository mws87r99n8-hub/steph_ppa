/* Analyse des dépenses — responsive, sans dépendance externe */
.analysis-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.analysis-toolbar .month-head{margin:0}
.analysis-filter{display:flex;align-items:center;gap:11px;font-size:12px;font-weight:750;color:var(--muted)}
.analysis-filter select{min-width:185px;max-width:280px;min-height:42px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:12px;font-weight:650}
.analysis-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:18px}
.analysis-kpi{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px}
.analysis-kpi small{font-size:11px;font-weight:750;color:var(--muted)}
.analysis-kpi strong{font-size:clamp(24px,2.4vw,32px);font-weight:800;letter-spacing:-.9px;font-variant-numeric:tabular-nums}
.analysis-kpi span{color:var(--muted);font-size:11px;line-height:1.45}
.analysis-kpi .analysis-rise{color:#ba5260}
.analysis-kpi .analysis-fall{color:#26876a}
.analysis-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:18px}
.analysis-rows{display:flex;flex-direction:column;gap:16px}
.analysis-row{display:grid;grid-template-columns:minmax(110px,1.15fr) minmax(75px,1fr) auto;gap:14px;align-items:center;min-width:0;color:var(--ink)}
.analysis-account-row{width:100%;background:transparent;border:0;padding:3px;text-align:left;border-radius:11px;cursor:pointer}
.analysis-account-row:hover{background:var(--soft)}
.analysis-row-label{min-width:0;display:flex;flex-direction:column;gap:5px}
.analysis-row-label strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.analysis-row-label small{font-size:10px;color:var(--muted);line-height:1.35}
.analysis-track{height:10px;border-radius:20px;background:#ecf1f4;overflow:hidden}
.analysis-track>span{display:block;height:100%;background:linear-gradient(90deg,#a5d4b4,#4d958b);border-radius:20px}
.analysis-row>b{white-space:nowrap;font-size:12px;font-variant-numeric:tabular-nums}
.analysis-empty{padding:18px 10px;color:var(--muted);font-size:12px;line-height:1.55}
.analysis-trend{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:13px;align-items:stretch;margin-top:6px;min-height:206px}
.analysis-trend-item{display:flex;flex-direction:column;align-items:center;justify-content:end;gap:9px;min-width:0}
.analysis-trend-value{font-size:10px;font-weight:750;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.analysis-trend-track{height:142px;width:100%;max-width:90px;display:flex;flex-direction:column;justify-content:end;background:#f1f5f5;border-radius:12px;overflow:hidden}
.analysis-trend-bar{width:100%;background:linear-gradient(180deg,#a9d9b7,#5c9a8c);border-radius:9px 9px 2px 2px;min-height:0}
.analysis-trend-period{font-size:10px;font-weight:750;color:var(--muted);white-space:nowrap;text-transform:capitalize}
.analysis-repeat-list{display:flex;flex-direction:column;gap:11px}
.analysis-repeat{padding:14px;border:1px solid var(--line);background:var(--soft);border-radius:14px;min-width:0}
.analysis-repeat-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.analysis-repeat-top>div{display:flex;flex-direction:column;gap:5px;min-width:0}
.analysis-repeat-top strong{font-size:12px;overflow-wrap:anywhere}
.analysis-repeat-top small{font-size:10px;color:var(--muted)}
.analysis-repeat-top>b{white-space:nowrap;font-size:13px;font-variant-numeric:tabular-nums}
.analysis-repeat-bottom{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:10px}
.analysis-frequency,.analysis-programmed{display:inline-flex;padding:5px 8px;border-radius:999px;background:#e0ede3;color:#3c7664;font-size:10px;font-weight:750}
.analysis-programmed{background:#eaf0f6;color:#527190}
.analysis-repeat-bottom .btn{margin-left:auto}
.analysis-scheduled{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px;border:1px solid var(--line);border-radius:12px}
.analysis-scheduled>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.analysis-scheduled strong{font-size:12px}
.analysis-scheduled small{font-size:10px;color:var(--muted)}
.analysis-scheduled b{font-size:12px;white-space:nowrap}
@media(max-width:980px){.analysis-grid{grid-template-columns:1fr}.analysis-kpi{padding:17px}.analysis-row{grid-template-columns:minmax(100px,1.1fr) minmax(65px,1fr) auto}}
@media(max-width:650px){
  .analysis-toolbar{align-items:stretch;flex-direction:column;gap:12px}
  .analysis-filter{justify-content:space-between}.analysis-filter select{min-width:0;flex:1}
  .analysis-kpis{grid-template-columns:1fr;gap:10px}
  .analysis-kpi{padding:16px;gap:6px}
  .analysis-kpi strong{font-size:25px}
  .analysis-grid{gap:12px;margin-bottom:12px}
  .analysis-row{grid-template-columns:minmax(92px,1fr) minmax(48px,.7fr) auto;gap:7px}
  .analysis-row>b{font-size:11px}
  .analysis-trend{gap:5px;min-height:190px}
  .analysis-trend-track{height:117px}
  .analysis-trend-value{font-size:8px}
  .analysis-trend-period{font-size:9px}
  .analysis-repeat{padding:12px}
  .analysis-repeat-bottom .btn{margin-left:0}
}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;transition-duration:0s!important;scroll-behavior:auto!important}}

function demoState(){const m=currentMonth(),prev=monthMove(m,-1);const date=(month,day)=>month+'-'+String(day).padStart(2,'0'); const nowDay=Number(isoDay().slice(-2));const past=day=>date(m,Math.min(Math.max(1,day),nowDay));const a='demo-courant',b='demo-epargne';const ts=[
 [a,past(1),2800,'Salaire mensuel','Revenus'],[a,past(3),-890,'Loyer','Logement'],[a,past(4),-74.9,'Électricité','Logement'],[a,past(5),-59.99,'Internet & mobile','Abonnements'],[a,past(6),-83.42,'Supermarché','Alimentation'],[a,past(7),-48.6,'Carburant','Transport'],[a,past(8),-23.5,'Café & déjeuner','Loisirs'],[a,past(9),-37.95,'Pharmacie','Santé'],[a,past(10),-65.23,'Courses du quotidien','Alimentation'],[a,past(11),-31.4,'Plateformes numériques','Abonnements'],
 [a,date(prev,1),2800,'Salaire mensuel','Revenus'],[a,date(prev,3),-890,'Loyer','Logement'],[a,date(prev,7),-158.3,'Courses','Alimentation'],[a,date(prev,10),-60,'Carburant','Transport'],[a,date(prev,14),-115,'Shopping','Achats'],[a,date(prev,20),-92,'Restaurant','Loisirs']
 ]; return {version:1,demo:true,accounts:[{id:a,name:'Compte principal',bank:'Compte de démonstration',type:'checking',openingBalance:1075,color:'#9dc5df',manual:true},{id:b,name:'Épargne projet',bank:'Compte de démonstration',type:'savings',openingBalance:4650,color:'#bde4b9',manual:true}],transactions:ts.map(([accountId,date,amount,merchant,category])=>({id:uid(),accountId,date,amount,merchant,category,notes:'',reconciled:false,source:'demo',splits:[]})),budgets:{[m]:{'Logement':1050,'Alimentation':420,'Transport':200,'Abonnements':120,'Loisirs':200,'Santé':100,'Achats':150,'Épargne':250,'Autres':100}},recurring:[{id:'rec-demo-1',accountId:a,merchant:'Loyer',amount:-890,category:'Logement',nextDate:addMonths(date(m,3),1),frequency:'monthly'},{id:'rec-demo-2',accountId:a,merchant:'Salaire mensuel',amount:2800,category:'Revenus',nextDate:addMonths(date(m,1),1),frequency:'monthly'},{id:'rec-demo-3',accountId:a,merchant:'Abonnement internet',amount:-39.9,category:'Abonnements',nextDate:moveDay(isoDay(),8),frequency:'monthly'}],settings:{hidden:false},imported:[]};}

function cloudIndicator(label,error=false){const node=byId('cloud-status');if(node){node.textContent=label;node.title=label;node.style.color=error?'#bd4c58':'#62826d'}}
function persist(){
  const safe=manualSnapshot();
  try{localStorage.setItem(KEY,JSON.stringify(safe))}catch(e){toast('Stockage local indisponible : exporte un JSON.',true)}
  if(cloud.ready&&!cloud.paused){cloud.pending=safe;cloudIndicator('Sauvegarde…');clearTimeout(cloud.timer);cloud.timer=setTimeout(flushCloudSave,250)}
}
async function flushCloudSave(){
  if(!cloud.ready||cloud.saving||!cloud.pending)return;
  const state=cloud.pending;cloud.pending=null;cloud.saving=true;
  try{
    const result=await api('/api/data/manual',{method:'PUT',body:JSON.stringify({revision:cloud.revision,state})});
    cloud.revision=result.revision;cloud.error='';cloudIndicator('Synchronisé');
  }catch(err){
    cloud.error=String(err?.message||err);
    cloud.pending=cloud.pending||state;
    cloudIndicator('Non sauvegardé',true);
    // Never overwrite a concurrent device edit or pretend data is backed up.
    if(/modifiées sur un autre appareil|409|Session expirée/i.test(cloud.error))cloud.ready=false;
    toast('Sauvegarde serveur impossible : '+cloud.error+' — exporte un JSON avant de quitter.',true);
  }finally{
    cloud.saving=false;
    if(cloud.pending&&cloud.ready){clearTimeout(cloud.timer);cloud.timer=setTimeout(flushCloudSave,500)}
  }
}

function dateSort(a,b){return b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id))}
function accountBalance(a){if(!a)return 0;if(a.manual===false)return num(a.balance);return round(num(a.openingBalance)+db.transactions.filter(t=>t.accountId===a.id).reduce((s,t)=>s+num(t.amount),0))}

function monthlyTransactions(m=month){return db.transactions.filter(t=>monthKey(t.date)===m)}
function outgoings(m=month){return round(monthlyTransactions(m).filter(t=>t.amount<0&&t.category!=='Virement').reduce((s,t)=>s-num(t.amount),0))}
function incoming(m=month){return round(monthlyTransactions(m).filter(t=>t.amount>0&&t.category!=='Virement').reduce((s,t)=>s+num(t.amount),0))}
function byCategory(m=month){const sums={}; for(const t of monthlyTransactions(m))if(t.amount<0&&t.category!=='Virement'){if(t.splits?.length)for(const s of t.splits)sums[s.category]=(sums[s.category]||0)+num(s.amount);else sums[t.category]=(sums[t.category]||0)-num(t.amount)}return Object.entries(sums).sort((a,b)=>b[1]-a[1])}
function spentOn(category,m=month){return round(byCategory(m).find(([cat])=>cat===category)?.[1]||0)}

function spanChart(data,colour='#b9e88d',fill=true){const vals=data.length?data:[0,0];const hi=Math.max(...vals,1),lo=Math.min(...vals,0),range=Math.max(hi-lo,1);const width=640,height=170,pts=vals.map((n,i)=>[8+i*(624/Math.max(1,vals.length-1)),153-((n-lo)/range)*136]);let path=pts.map(([x,y],i)=>`${i?'L':'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');let area=`${path} L${pts.at(-1)[0].toFixed(1)} 158 L${pts[0][0].toFixed(1)} 158 Z`;return `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-label="Evolution des soldes"><defs><linearGradient id="area-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${colour}" stop-opacity=".35"/><stop offset="100%" stop-color="${colour}" stop-opacity="0"/></linearGradient></defs>${[32,92,152].map(y=>`<path d="M8 ${y}H632" stroke="#e9eef3" stroke-width="1" stroke-dasharray="4 6"/>`).join('')}${fill?`<path d="${area}" fill="url(#area-grad)"/>`:''}<path d="${path}" fill="none" stroke="${colour}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${pts.length?`<circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="5" fill="${colour}" stroke="white" stroke-width="2"/>`:''}</svg>`}
function computeTrend(){const out=[];const m=currentMonth(),[yy,mm]=m.split('-').map(Number);const max=new Date(yy,mm,0).getDate();let bal=allBalance();const sorted=db.transactions.filter(t=>monthKey(t.date)===m).sort(dateSort);for(let d=max;d>=1;d--){const date=`${m}-${String(d).padStart(2,'0')}`;out.unshift(round(bal));bal-=sorted.filter(t=>t.date===date).reduce((s,t)=>s+num(t.amount),0)}return out}
function upcomingEntries(days=90){const start=isoDay(),end=moveDay(start,days),arr=[];for(const r of db.recurring){let x=r.nextDate;let guard=0;while(x<=end&&guard++<200){if(x>=start)arr.push({...r,occurrence:x});if(r.frequency==='once')break;const next=r.frequency==='weekly'?moveDay(x,7):r.frequency==='biweekly'?moveDay(x,14):addMonths(x,r.frequency==='yearly'?12:r.frequency==='quarterly'?3:1);if(next===x)break;x=next;}}return arr.sort((a,b)=>a.occurrence.localeCompare(b.occurrence))}

let bankCoverage=null;
let analysisAccount='all',analysisCandidates=[];
const ANALYSIS_PERIODS={weekly:{label:'Hebdomadaire',days:7,annual:52},biweekly:{label:'Toutes les 2 semaines',days:14,annual:26},monthly:{label:'Mensuelle',days:30,annual:12},quarterly:{label:'Trimestrielle',days:91,annual:4},yearly:{label:'Annuelle',days:365,annual:1}};
function expenseRowsForAnalysis(period=null,account='all'){
  return db.transactions.filter(t=>t&&!t.deleted&&!t.future&&num(t.amount)<0&&t.category!=='Virement'&&!t.linkedTransfer&&(account==='all'||t.accountId===account)&&(!period||monthKey(t.date)===period));

function expenseTotalForAnalysis(rows){return round(rows.reduce((total,t)=>total+Math.abs(num(t.amount)),0))}
function categoryTotalsForAnalysis(rows){
  const amounts=new Map();
  for(const t of rows){
    const sum=Math.abs(num(t.amount));
    const splits=Array.isArray(t.splits)?t.splits.filter(x=>num(x.amount)>0):[];
    const splitTotal=splits.reduce((a,x)=>a+num(x.amount),0);
    const parts=(splits.length&&Math.abs(splitTotal-sum)<0.06)?splits.map(x=>[String(x.category||'Autres'),num(x.amount)]):[[String(t.category||'Autres'),sum]];
    for(const [cat,amount] of parts)amounts.set(cat,(amounts.get(cat)||0)+amount);
  }
  return [...amounts.entries()].map(([name,amount])=>({name,amount:round(amount)})).sort((a,b)=>b.amount-a.amount);
}
function accountTotalsForAnalysis(rows){
  const data=new Map();
  for(const t of rows){
    const entry=data.get(t.accountId)||{id:t.accountId,amount:0,count:0};
    entry.amount+=Math.abs(num(t.amount));entry.count++;data.set(t.accountId,entry);
  }
  return [...data.values()].map(x=>({...x,name:accName(x.id),amount:round(x.amount)})).sort((a,b)=>b.amount-a.amount);

function normalizeRecurringMerchant(text){
  const raw=String(text||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
  const name=raw.replace(/\b(?:PRELEVEMENT|PRELEV|PRLV|VIREMENT|VIR|SEPA|CB|CARTE|PAIEMENT|FACTURE|ABONNEMENT|ECHEANCE|ACHAT|DU|DE|DES|LE|LA|LES)\b/g,' ')

function daysBetweenAnalysis(a,b){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(a)||!/^\d{4}-\d{2}-\d{2}$/.test(b))return NaN;
  const da=new Date(a+'T12:00:00Z'),dbb=new Date(b+'T12:00:00Z');
  return Math.round((dbb.getTime()-da.getTime())/86400000);
}
function monthsBetweenAnalysis(a,b){return (Number(b.slice(0,4))-Number(a.slice(0,4)))*12+Number(b.slice(5,7))-Number(a.slice(5,7))}
function detectRecurrenceCadence(dates){
  if(dates.length<3)return null;
  const recent=dates.slice(-4),gaps=[];
  for(let i=1;i<recent.length;i++)gaps.push(daysBetweenAnalysis(recent[i-1],recent[i]));
  if(gaps.some(g=>!Number.isFinite(g)||g<=0))return null;
  if(gaps.every(g=>g>=6&&g<=8))return 'weekly';
  if(gaps.every(g=>g>=12&&g<=16))return 'biweekly';
  const mg=recent.slice(1).map((d,i)=>monthsBetweenAnalysis(recent[i],d));
  if(mg.every((g,i)=>g===1&&gaps[i]>=24&&gaps[i]<=37))return 'monthly';
  if(mg.every((g,i)=>g===3&&gaps[i]>=80&&gaps[i]<=104))return 'quarterly';
  if(mg.every((g,i)=>g===12&&gaps[i]>=350&&gaps[i]<=380))return 'yearly';
  return null;
}
function forecastRecurrenceDate(last,kind){
  const base=fromDay(last),now=fromDay(isoDay()),day=base.getDate();
  let candidate=new Date(base.getTime());
  const step={monthly:1,quarterly:3,yearly:12}[kind]||0;
  for(let i=1;i<=48;i++){
    if(step){
      const monthStart=new Date(base.getFullYear(),base.getMonth()+step*i,1);
      const lastDay=new Date(monthStart.getFullYear(),monthStart.getMonth()+1,0).getDate();
      candidate=new Date(monthStart.getFullYear(),monthStart.getMonth(),Math.min(day,lastDay),12);
    }else{candidate=new Date(base.getFullYear(),base.getMonth(),base.getDate()+ANALYSIS_PERIODS[kind].days*i,12)}
    if(candidate>now)return isoDay(candidate);
  }
  return null;
}
function findExpenseRecurrences(account='all'){
  const grouped=new Map();
  for(const t of expenseRowsForAnalysis(null,account)){
    const merchant=normalizeRecurringMerchant(t.merchant);
    if(!merchant||Math.abs(num(t.amount))<1||!/^\d{4}-\d{2}-\d{2}$/.test(String(t.date||'')))continue;
    const key=String(t.accountId)+'|'+merchant;
    if(!grouped.has(key))grouped.set(key,[]);
    grouped.get(key).push(t);
  }
  const output=[];
  for(const rows of grouped.values()){
    rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const unique=[],seen=new Set();
    for(const t of rows){
      const signature=t.date+'|'+round(Math.abs(num(t.amount)));
      if(!seen.has(signature)){unique.push(t);seen.add(signature)}
    }
    if(unique.length<3)continue;
    const cadence=detectRecurrenceCadence(unique.map(t=>t.date));
    if(!cadence)continue;
    const recent=unique.slice(-4),values=recent.map(t=>Math.abs(num(t.amount))).sort((a,b)=>a-b);
    const median=(values[Math.floor((values.length-1)/2)]+values[Math.floor(values.length/2)])/2;
    if(median<=0)continue;
    const maxDeviation=Math.max(...values.map(v=>Math.abs(v-median)))/median;
    if(maxDeviation>0.45)continue;
    const latest=recent.at(-1),m=normalizeRecurringMerchant(latest.merchant);
    const programmed=db.recurring.some(e=>e.accountId===latest.accountId&&num(e.amount)<0&&normalizeRecurringMerchant(e.merchant)===m);
    output.push({
      accountId:latest.accountId,merchant:latest.merchant,category:latest.category||'Autres',
      cadence,amount:round(median),variable:maxDeviation>0.12,
      lastDate:latest.date,nextDate:forecastRecurrenceDate(latest.date,cadence),
      occurrences:unique.length,programmed
    });
  }
  return output.sort((a,b)=>b.amount-a.amount||b.lastDate.localeCompare(a.lastDate));
}

function setBankAccountName(a,newName){
  if(!a||a.manual!==false)return;
  const name=String(newName||'').replace(/\s+/g,' ').trim();
  if(!name||name.length>70)return toast('Nom de compte invalide (1 à 70 caractères).',true);
  if(cloud.enabled&&!cloud.ready)return toast('Le serveur n’est pas connecté. Aucune modification enregistrée.',true);
  const original=String(a.providerName||a.name);
  db.bankAliases??={};
  if(name===original)delete db.bankAliases[a.enableAccountId];
  else db.bankAliases[a.enableAccountId]=name;
  a.name=name;
  persist();
  closeModal();render();
  toast('Nom modifié. '+(cloud.enabled?'Sauvegarde sécurisée en cours.':'Modification locale enregistrée.'));
}

}

    if(remote.manual){

}

function normalizeCategoryLabel(text){
  return String(text||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase().replace(/[^A-Z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}
function merchantCategoryRuleKey(text){
  const stop=/^(?:CB|CARTE|PAIEMENT|PRELEVEMENT|PRELEV|PRLV|SEPA|VIR|VIREMENT|REF|REFERENCE|FACTURE|TRANSACTION|OPERATION|BANCAIRE|DE|DU|DES|LE|LES|LA|A|AU|PAR|POUR|CHEZ|SUR|FR|FRANCE|WWW|COM|EUR|NUMERO|ACHAT|INTERNET|POS|DATE|SCT|ID)$/;
  const all=normalizeCategoryLabel(text).split(' ')
    .filter(x=>x&&!/^\d+$/.test(x)&&x.length>=2&&!stop.test(x));
  const key=all.slice(0,6).join(' ').slice(0,96);
  if(key.length<4||/^(?:RETRAIT|DAB|VIREMENT|PAIEMENT|CARTE|COMPTE|AUTRES|INCONNU|RELEVE)$/.test(key))return '';
  return key;
}

function inferCategory(merchant,amount){
  if(num(amount)>0)return 'Revenus';
  const key=merchantCategoryRuleKey(merchant);
  const learned=key&&(db.categoryRules||{})[key];
  if(learned&&CATEGORIES[learned]&&learned!=='Revenus')return learned;
  const label=normalizeCategoryLabel(merchant);
  for(const [category,expressions] of AUTO_CATEGORY_PATTERNS){
    if(expressions.some(expr=>expr.test(label)))return category;
  }
  return 'Autres';
}

function inferSubcategory(merchant,category,amount){
  if(!SUBCATEGORIES[category])return 'À préciser';
  const key=merchantCategoryRuleKey(merchant);
  const learned=key&&(db.subcategoryRules||{})[key];
  if(learned&&SUBCATEGORIES[category].includes(learned))return learned;
  const label=normalizeCategoryLabel(merchant);
  for(const [subcategory,expression] of AUTO_SUBCATEGORY_PATTERNS[category]||[]){
    if(expression.test(label))return subcategory;
  }
  return category==='Virement'?'Autres virements':category==='Revenus'?'Autres revenus':'À préciser';
}

  if(!key)return false;
  db.subcategoryRules??={};db.subcategoryRules[key]=subcategory;

}
function validSubcategory(category,subcategory){

function isManualImportedCategory(tx,merchant,amount){

function recategorizeImportedExpenses(){
  let changed=0,subcategorized=0,uncertain=0,protectedEdits=0;
  for(const tx of db.transactions){
    if(!tx||!Number.isFinite(Number(tx.amount)))continue;
    const fromImport=['enablebanking','csv','qif','ofx'].includes(tx.source);
    const provider=tx.providerMerchant||tx.merchant;
    const hasSplits=Array.isArray(tx.splits)&&tx.splits.length>0;
    // A handwritten transaction's category is always user-provided.
    const protectedCategory=!fromImport||isManualImportedCategory(tx,provider,tx.amount)||hasSplits;
    if(fromImport&&num(tx.amount)<0){
      if(protectedCategory){
        tx.categoryManual=true;protectedEdits++;
      }else{
        const predicted=inferCategory(provider,tx.amount);
        if(tx.category!==predicted){tx.category=predicted;changed++}
        tx.categoryManual=false;
      }
    }
    const category=CATEGORIES[tx.category]?tx.category:'Autres';
    if(tx.subcategoryManual!==true){
      const subtype=inferSubcategory(provider,category,tx.amount);
      if(tx.subcategory!==subtype){tx.subcategory=subtype;changed++;subcategorized++}
      tx.subcategoryManual=false;
    }else if(!validSubcategory(category,tx.subcategory)){
      // Keep the user's original annotation in their JSON backup. Display a
      // valid default if they changed its parent category separately.
      tx.subcategory=inferSubcategory(provider,category,tx.amount);
      tx.subcategoryManual=false;changed++;subcategorized++;
    }
    for(const part of tx.splits||[]){
      if(!part||!CATEGORIES[part.category])continue;
      if(!validSubcategory(part.category,part.subcategory)){
        part.subcategory=inferSubcategory(provider,part.category,tx.amount);changed++;subcategorized++;
      }
    }
    if(fromImport&&num(tx.amount)<0&&tx.category==='Autres')uncertain++;
  }
  return {changed,subcategorized,uncertain,protectedEdits};
}

function importEnableBankingData(payload){
  if(!Array.isArray(payload.accounts)||!Array.isArray(payload.transactions))
    throw Error('Réponse bancaire non reconnue');
  if(payload.coverage&&typeof payload.coverage==='object')bankCoverage=payload.coverage;
  let addedAccounts=0,addedTx=0,updatedTx=0,deletedTx=0,classified=0,unclassified=0;
  const ts=isoDay();
  for(const r of payload.accounts){
    if(r.currency_code!=='EUR'&&!(r.balance_available===false&&String(r.type||'').toLowerCase()==='savings'&&['XXX',''].includes(String(r.currency_code||''))))continue;
    const remote=String(r.id);
    let a=db.accounts.find(a=>a.enableAccountId===remote);
    const providerName=String(r.name||'Compte bancaire').slice(0,100);
    const alias=String((db.bankAliases||{})[remote]||'').trim();
    const bankTypes={SVGS:'savings',CACC:'checking',CASH:'checking',CARD:'card',LOAN:'loan'};
    const type=bankTypes[String(r.type||'').toUpperCase()]||String(r.type||'checking');
    const balanceAvailable=r.balance_available!==false&&r.balance!==null&&r.balance!==undefined&&Number.isFinite(Number(r.balance));
    const value={name:alias||providerName,providerName,type,bank:'Société Générale',
      balance:balanceAvailable?round(num(r.balance)):null,balanceAvailable,
      currency:balanceAvailable?'EUR':String(r.currency_code||'XXX'),
      manual:false,enableAccountId:remote,updatedAt:r.updated_at||ts};
    const stableId='eb-'+remote;
    if(a){
      if(a.id!==stableId){
        const prior=a.id;
        for(const t of db.transactions)if(t.accountId===prior)t.accountId=stableId;
        for(const e of db.recurring)if(e.accountId===prior)e.accountId=stableId;
        a.id=stableId;
      }
      Object.assign(a,value);
    }else{
      db.accounts.push({id:stableId,color:'#b1daca',...value});addedAccounts++;
    }
  }
  for(const r of payload.transactions){
    const a=db.accounts.find(a=>a.enableAccountId===String(r.account_id));
    if(!a||r.future)continue;
    const ref=String(r.id);
    if(r.deleted){
      const before=db.transactions.length;
      db.transactions=db.transactions.filter(t=>t.enableTransactionId!==ref);
      deletedTx+=before-db.transactions.length;continue;
    }
    const rawMerchant=String(r.clean_description||r.provider_description||'Opération bancaire').slice(0,160);
    const amount=round(num(r.amount)),date=String(r.date||'').slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date))continue;
    const override=(db.bankOverrides||{})[ref];
    const previous=db.transactions.find(t=>t.enableTransactionId===ref);
    const legacy=legacyInferCategory(rawMerchant,amount);
    const explicitManual=override
      ?(typeof override.manualCategory==='boolean'?override.manualCategory:
        !!(override.category&&override.category!==legacy))
      :previous?isManualImportedCategory(previous,rawMerchant,amount):false;
    const shownMerchant=String(override?.merchant||previous?.merchant||rawMerchant).slice(0,160);
    const category=explicitManual
      ?String(override?.category||previous?.category||legacy)
      :inferCategory(rawMerchant,amount);
    const safeCategory=CATEGORIES[category]?category:inferCategory(rawMerchant,amount);
    const note=String(override?.notes??previous?.notes??'').slice(0,300);
    const reconciled=override?!!override.reconciled:!!previous?.reconciled;
    const oldSplits=override&&Array.isArray(override.splits)?override.splits:previous?.splits||[];
    const splitSum=oldSplits.reduce((sum,x)=>sum+num(x.amount),0);
    const splits=Math.abs(splitSum-Math.abs(amount))<0.06?oldSplits:[];
    if(previous){
      Object.assign(previous,{accountId:a.id,date,amount,providerMerchant:rawMerchant,merchant:shownMerchant,
        category:safeCategory,categoryManual:explicitManual,notes:note,reconciled,splits,
        enableTransactionId:ref,source:'enablebanking'});
      updatedTx++;
    }else{
      db.transactions.push({id:'ebt-'+ref,accountId:a.id,date,amount,providerMerchant:rawMerchant,
        merchant:shownMerchant,category:safeCategory,categoryManual:explicitManual,
        notes:note,reconciled,splits,source:'enablebanking',enableTransactionId:ref});
      addedTx++;
    }
    if(amount<0){
      if(safeCategory==='Autres')unclassified++;
      else if(!explicitManual)classified++;
    }
  }
  if(payload.accounts.length)db.demo=false;
  const recat=recategorizeImportedExpenses();
  persist();
  return {addedAccounts,addedTx,updatedTx,deletedTx,
    classified,unclassified,recategorized:recat.changed};
}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-view],[data-action]');if(!el)return;if(el.dataset.view){navigate(el.dataset.view);return}const act=el.dataset.action;if(act==='overlay'&&!e.target.classList.contains('overlay'))return;const id=el.dataset.id;switch(act){case 'overlay':case 'close-modal':closeModal();break;case 'settings':openSettings();break;case 'toggle-hide':db.settings??={};db.settings.hidden=!db.settings.hidden;persist();renderNav();toast(db.settings.hidden?'Montants masqués.':'Montants affichés.');break;case 'add-transaction':openTransaction();break;case 'go-budgets':navigate('budgets');break;case 'go-analysis':navigate('analysis');break;case 'auto-classify':{const result=recategorizeImportedExpenses();if(result.changed)persist();render();toast(result.changed+' opération(s) reclassée(s). '+result.uncertain+' dépense(s) restent à vérifier.')}break;case 'edit-transaction':openTransaction(id);break;case 'toggle-reconcile':{const t=db.transactions.find(t=>t.id===id);if(t){t.reconciled=!t.reconciled;persist();render();toast(t.reconciled?'Opération pointée.':'Pointage retiré.')}}break;case 'delete-transaction':removeTransaction(id);break;case 'kind':{const current=el.dataset.kind;openTransaction(modal?.id||null,current);break}case 'add-split':{const wrap=byId('split-rows');wrap?.insertAdjacentHTML('beforeend',splitRow());updateSplitTotal();break}case 'remove-split':el.closest('.split-row')?.remove();updateSplitTotal();break;case 'prev-month':setMonth(-1);break;case 'next-month':setMonth(1);break;case 'set-budget':openBudget();break;case 'budget-category':openBudget(el.dataset.category);break;case 'add-account':openAccount();break;case 'analysis-choose-account':analysisAccount=analysisAccount===el.dataset.account?'all':el.dataset.account;render();break;case 'analysis-program':{const index=Number(el.dataset.index);if(Number.isInteger(index)&&index>=0&&index<analysisCandidates.length){const candidate=analysisCandidates[index];if(!candidate.programmed)openRecurring(null,candidate)}break}case 'edit-account':openAccount(id);break;case 'rename-bank-account':openBankAccountRename(id);break;case 'restore-bank-account-name':restoreBankAccountName(id);break;case 'delete-account':deleteAccount(id);break;case 'add-recurring':openRecurring();break;case 'edit-recurring':openRecurring(id);break;case 'delete-recurring':deleteRecurring(id);break;case 'apply-recurring':applyRecurring(id,el.dataset.date);break;case 'merge-precloud':mergePrecloudManual();break;case 'bank-module':openBank();break;case 'bank-connect':connectBank();break;case 'bank-sync':syncBank();break;case 'bank-logout':logoutBank();break;case 'bank-disconnect':disconnectBank();break;case 'export-json':exportJson();break;case 'export-csv':exportCsv();break;case 'restore-json':byId('json-picker').value='';byId('json-picker').click();break;case 'import-bank':openImport();break;case 'clear-demo':clearDemo();break;case 'reset-data':resetData();break;}}
);
document.addEventListener('submit',async e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const type=form.dataset.form;if(type==='transaction')saveTransaction(form);if(type==='budget')saveBudget(form);if(type==='account')saveAccount(form);if(type==='bank-rename')saveBankAccountRename(form);if(type==='recurring')saveRecurring(form);if(type==='import')saveImport(form);if(type==='bank-login')await loginBank(form)});
document.addEventListener('input',e=>{if(e.target.id==='search-operations'){search=e.target.value;const container=byId('operation-rows');if(container)container.innerHTML=filterRows()}if(e.target.closest('#split-rows')||e.target.id==='f-amount')updateSplitTotal()});
document.addEventListener('change',e=>{if(e.target.id==='analysis-account'){analysisAccount=e.target.value;render()}if(e.target.id==='filter-account'){accountFilter=e.target.value;byId('operation-rows').innerHTML=filterRows()}if(e.target.id==='filter-category'){catFilter=e.target.value;byId('operation-rows').innerHTML=filterRows()}if(e.target.id==='f-category'&&modal?.type==='budget'){const newValue=db.budgets[month]?.[e.target.value]??'';const input=byId('f-amount');if(input)input.value=newValue}});
byId('csv-picker').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{await processImportFile(f,'bank')}catch(err){toast('Import impossible : '+err.message,true)}});
byId('json-picker').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{await processImportFile(f,'json')}catch(err){toast('Restauration : '+err.message,true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&byId('modal-host').children.length)closeModal();if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();navigate('transactions');byId('search-operations')?.focus()}});
render();
async function bootstrapCadran(){
  const callback=new URLSearchParams(location.search).get('bank_callback');
  await readBankStatus();
  if(cloud.enabled){
    try{
      const state=await api('/api/data/status');
      if(!state.storageConfigured){
        cloudIndicator('Base serveur à raccorder',true);
        toast('Base sécurisée à raccorder dans Render. La sauvegarde locale reste disponible.',true);
      }else if(state.authenticated){
        await hydrateServerData();
      }else{
        cloudIndicator('Cadran verrouillé');
        await openBank();
      }
    }catch(err){
      cloudIndicator('Stockage serveur indisponible',true);
      toast('Stockage serveur indisponible : données locales conservées, mais non partagées.',true);
    }
  }
  if(callback!==null){
    const u=new URL(location.href);u.searchParams.delete('bank_callback');
    history.replaceState({},'',u.pathname+u.search+u.hash);
    navigate('accounts');
    const ok=callback==='1';
    toast(ok?'Autorisation Société Générale enregistrée.':'Autorisation bancaire non validée.',!ok);
    if(ok&&bankState.authenticated&&bankState.connected)syncBank();
  }else if(bankState.authenticated&&bankState.connected&&(!cloud.enabled||cloud.ready)&&!db.demo){
    refreshAuthorizedBankAccounts();
  }else if(view==='accounts')render();
}
bootstrapCadran().catch(()=>toast('Initialisation incomplète : recharge Cadran.',true));

if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
