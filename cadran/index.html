 [a,past(1),2800,'Salaire mensuel','Revenus'],[a,past(3),-890,'Loyer','Logement'],[a,past(4),-74.9,'Électricité','Logement'],[a,past(5),-59.99,'Internet & mobile','Abonnements'],[a,past(6),-83.42,'Supermarché','Alimentation'],[a,past(7),-48.6,'Carburant','Transport'],[a,past(8),-23.5,'Café & déjeuner','Loisirs'],[a,past(9),-37.95,'Pharmacie','Santé'],[a,past(10),-65.23,'Courses du quotidien','Alimentation'],[a,past(11),-31.4,'Plateformes numériques','Abonnements'],
 [a,date(prev,1),2800,'Salaire mensuel','Revenus'],[a,date(prev,3),-890,'Loyer','Logement'],[a,date(prev,7),-158.3,'Courses','Alimentation'],[a,date(prev,10),-60,'Carburant','Transport'],[a,date(prev,14),-115,'Shopping','Achats'],[a,date(prev,20),-92,'Restaurant','Loisirs']
 ]; return {version:1,demo:true,accounts:[{id:a,name:'Compte principal',bank:'Compte de démonstration',type:'checking',openingBalance:1075,color:'#9dc5df',manual:true},{id:b,name:'Épargne projet',bank:'Compte de démonstration',type:'savings',openingBalance:4650,color:'#bde4b9',manual:true}],transactions:ts.map(([accountId,date,amount,merchant,category])=>({id:uid(),accountId,date,amount,merchant,category,notes:'',reconciled:false,source:'demo',splits:[]})),budgets:{[m]:{'Logement':1050,'Alimentation':420,'Transport':200,'Abonnements':120,'Loisirs':200,'Santé':100,'Achats':150,'Épargne':250,'Autres':100}},recurring:[{id:'rec-demo-1',accountId:a,merchant:'Loyer',amount:-890,category:'Logement',nextDate:addMonths(date(m,3),1),frequency:'monthly'},{id:'rec-demo-2',accountId:a,merchant:'Salaire mensuel',amount:2800,category:'Revenus',nextDate:addMonths(date(m,1),1),frequency:'monthly'},{id:'rec-demo-3',accountId:a,merchant:'Abonnement internet',amount:-39.9,category:'Abonnements',nextDate:moveDay(isoDay(),8),frequency:'monthly'}],settings:{hidden:false},imported:[]};}
function load(){try{let j=JSON.parse(localStorage.getItem(KEY));if(j&&Array.isArray(j.accounts)&&Array.isArray(j.transactions)&&j.budgets&&Array.isArray(j.recurring))return j}catch(e){console.warn('Données locales illisibles',e)}return demoState()}
let db=load(),view='overview',month=currentMonth(),search='',catFilter='all',accountFilter='all',bankState={configured:false,authenticated:false,provider:'Enable Banking',error:''},editKind='expense',modal=null,importDraft=null;
function persist(){try{const ids=new Set(db.accounts.filter(a=>a.manual===false||a.enableAccountId).map(a=>a.id));const safe={...db,accounts:db.accounts.filter(a=>!ids.has(a.id)),transactions:db.transactions.filter(t=>!ids.has(t.accountId)&&t.source!=='enablebanking'),recurring:db.recurring.filter(r=>!ids.has(r.accountId))};localStorage.setItem(KEY,JSON.stringify(safe))}catch(e){toast('Stockage local indisponible : exportez vos données.',true)}}
if(!localStorage.getItem(KEY))persist();
function dateSort(a,b){return b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id))}
function accountBalance(a){if(!a)return 0;if(a.manual===false)return num(a.balance);return round(num(a.openingBalance)+db.transactions.filter(t=>t.accountId===a.id).reduce((s,t)=>s+num(t.amount),0))}
function allBalance(){return round(db.accounts.reduce((sum,a)=>sum+accountBalance(a),0))}
function monthlyTransactions(m=month){return db.transactions.filter(t=>monthKey(t.date)===m)}
function outgoings(m=month){return round(monthlyTransactions(m).filter(t=>t.amount<0&&t.category!=='Virement').reduce((s,t)=>s-num(t.amount),0))}
function incoming(m=month){return round(monthlyTransactions(m).filter(t=>t.amount>0&&t.category!=='Virement').reduce((s,t)=>s+num(t.amount),0))}
function byCategory(m=month){const sums={}; for(const t of monthlyTransactions(m))if(t.amount<0&&t.category!=='Virement'){if(t.splits?.length)for(const s of t.splits)sums[s.category]=(sums[s.category]||0)+num(s.amount);else sums[t.category]=(sums[t.category]||0)-num(t.amount)}return Object.entries(sums).sort((a,b)=>b[1]-a[1])}
function spentOn(category,m=month){return round(byCategory(m).find(([cat])=>cat===category)?.[1]||0)}
function accName(id){return db.accounts.find(a=>a.id===id)?.name||'Compte supprimé'}
function hasAccount(){if(db.accounts.length)return true;toast('Créez d’abord un compte.');navigate('accounts');return false}
function categoryIcon(cat){const c=CATEGORIES[cat]||CATEGORIES.Autres;return `<div class="category-emoji" style="background:${c.color};color:${c.ink}">${h(c.emoji)}</div>`}
function categoryAvatar(cat){const c=CATEGORIES[cat]||CATEGORIES.Autres;return `<div class="txn-avatar" style="background:${c.color};color:${c.ink}">${h(c.abbr)}</div>`}
function btn(label,action,cls='btn-light',iconName){return `<button type="button" class="btn ${cls}" data-action="${h(action)}">${iconName?ico(iconName):''}${h(label)}</button>`}
function header(title,subtitle,actions='',tag=''){return `<div class="page-heading"><div><p class="eyebrow">${tag||'VOTRE ESPACE FINANCIER'} ${db.demo?'<span class="demo-banner">Mode démo</span>':''}</p><h1 class="page-title">${title}</h1>${subtitle?`<p class="page-subtitle">${subtitle}</p>`:''}</div><div class="page-actions">${actions}</div></div>`}
function setMonth(delta){month=monthMove(month,delta);render()}
function monthPicker(){return `<div class="month-head"><button class="month-arrows" data-action="prev-month" aria-label="Mois précédent">${ico('arrow-left')}</button><span class="month-label">${h(fmtMonth.format(fromDay(month+'-01')))}</span><button class="month-arrows" data-action="next-month" aria-label="Mois suivant">${ico('arrow-right')}</button></div>`}

function renderNav(){const item=(id,label,iconName,small)=>`<button class="${small?'mobile-link':'nav-item'} ${view===id?'active':''}" data-view="${id}" aria-label="${h(label)}">${ico(iconName)}<span>${small&&id==='overview'?'Accueil':label}</span></button>`;byId('desktop-nav').innerHTML=NAV.map(([id,label,iconName])=>item(id,label,iconName,false)).join('');byId('mobile-nav').innerHTML=NAV.map(([id,label,iconName])=>item(id,label,iconName,true)).join('');byId('page-breadcrumb').textContent=NAV.find(n=>n[0]===view)?.[1]||'Vue d’ensemble';byId('today-label').textContent=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'}).format(new Date());document.body.classList.toggle('hide-values',!!db.settings?.hidden);}

function render(){renderNav();const views={overview:renderOverview,transactions:renderTransactions,budgets:renderBudgets,forecast:renderForecast,accounts:renderAccounts};byId('main').innerHTML=(views[view]||renderOverview)();if(location.hostname==='cadran-budget.onrender.com'){byId('main').insertAdjacentHTML('afterbegin',`<div class="notice warning" style="margin-bottom:22px" role="status"><strong>Version sans connexion bancaire</strong>Pour relier Société Générale, utilisez <a href="https://cadran-budget-connect.onrender.com/" style="color:inherit;font-weight:800;text-decoration:underline">Cadran Connect</a>. Les données enregistrées ici ne sont pas transférées automatiquement : faites d'abord une sauvegarde JSON depuis Paramètres.</div>`)}}
function spanChart(data,colour='#b9e88d',fill=true){const vals=data.length?data:[0,0];const hi=Math.max(...vals,1),lo=Math.min(...vals,0),range=Math.max(hi-lo,1);const width=640,height=170,pts=vals.map((n,i)=>[8+i*(624/Math.max(1,vals.length-1)),153-((n-lo)/range)*136]);let path=pts.map(([x,y],i)=>`${i?'L':'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');let area=`${path} L${pts.at(-1)[0].toFixed(1)} 158 L${pts[0][0].toFixed(1)} 158 Z`;return `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-label="Evolution des soldes"><defs><linearGradient id="area-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${colour}" stop-opacity=".35"/><stop offset="100%" stop-color="${colour}" stop-opacity="0"/></linearGradient></defs>${[32,92,152].map(y=>`<path d="M8 ${y}H632" stroke="#e9eef3" stroke-width="1" stroke-dasharray="4 6"/>`).join('')}${fill?`<path d="${area}" fill="url(#area-grad)"/>`:''}<path d="${path}" fill="none" stroke="${colour}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${pts.length?`<circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="5" fill="${colour}" stroke="white" stroke-width="2"/>`:''}</svg>`}
function computeTrend(){const out=[];const m=currentMonth(),[yy,mm]=m.split('-').map(Number);const max=new Date(yy,mm,0).getDate();let bal=allBalance();const sorted=db.transactions.filter(t=>monthKey(t.date)===m).sort(dateSort);for(let d=max;d>=1;d--){const date=`${m}-${String(d).padStart(2,'0')}`;out.unshift(round(bal));bal-=sorted.filter(t=>t.date===date).reduce((s,t)=>s+num(t.amount),0)}return out}
function upcomingEntries(days=90){const start=isoDay(),end=moveDay(start,days),arr=[];for(const r of db.recurring){let x=r.nextDate;let guard=0;while(x<=end&&guard++<200){if(x>=start)arr.push({...r,occurrence:x});if(r.frequency==='once')break;const next=r.frequency==='weekly'?moveDay(x,7):addMonths(x,r.frequency==='yearly'?12:r.frequency==='quarterly'?3:1);if(next===x)break;x=next;}}return arr.sort((a,b)=>a.occurrence.localeCompare(b.occurrence))}
function forecastSeries(days=60){const arr=upcomingEntries(days);let balance=allBalance(),vals=[balance],labels=[isoDay()];for(let i=1;i<=days;i++){const d=moveDay(isoDay(),i);balance=round(balance+arr.filter(r=>r.occurrence===d).reduce((s,r)=>s+num(r.amount),0));vals.push(balance);labels.push(d)}return {vals,labels}}
function rowTransaction(t,withActions=true){const c=t.splits?.length?`${t.category} · ${t.splits.length} postes`:t.category;return `<div class="transaction-row">${categoryAvatar(t.category)}<div class="txn-main"><div class="txn-title">${h(t.merchant)}</div><div class="txn-sub">${h(c)} · ${h(accName(t.accountId))} · ${formatDate(t.date)} ${t.reconciled?'✓ Pointée':''}</div></div><div class="txn-amount ${t.amount>=0?'positive':'negative'}">${t.amount>0?'+ ':t.amount===0?'':'− '}${money(Math.abs(t.amount))}</div>${withActions?`<div class="txn-actions"><button class="txn-action" data-action="edit-transaction" data-id="${h(t.id)}" title="Modifier">${ico('edit')}</button><button class="txn-action" data-action="toggle-reconcile" data-id="${h(t.id)}" title="Pointer / Dépointer">${ico('check')}</button></div>`:''}</div>`}
function groupedRows(list){if(!list.length)return `<div class="empty">Aucune opération pour les filtres sélectionnés.</div>`;let previous='';return list.map(t=>{const heading=t.date!==previous?`<div class="group-date">${formatDate(t.date,true)}</div>`:'';previous=t.date;return heading+rowTransaction(t)}).join('')}
function renderOverview(){const inc=incoming(currentMonth()),out=outgoings(currentMonth()),delta=inc-out,total=allBalance();const cats=byCategory(currentMonth()).slice(0,5),max=Math.max(1,...cats.map(c=>c[1]));const txns=[...db.transactions].sort(dateSort).slice(0,5);const next=upcomingEntries(30);const netNext=round(next.reduce((s,r)=>s+r.amount,0));return `${header('Bonjour 👋','Gardez un œil sur votre situation financière.',`${btn('Connexion bancaire','bank-module','btn-mint','bank')} ${btn('Nouvelle opération','add-transaction','btn-dark','plus')}`)}<div class="layout-summary"><section class="overview-hero"><div class="hero-top"><div><div class="hero-label"><span class="status-dot"></span>Solde de tous vos comptes</div><div class="hero-balance">${money(total)}</div><div class="hero-description">${db.accounts.length} compte${db.accounts.length>1?'s':''} suivi${db.accounts.length>1?'s':''} ${db.demo?'· Données fictives':''}</div></div><span class="hero-trend">${netNext>=0?'+ ':''}${shortMoney(netNext)} à venir</span></div><div class="hero-footer"><div class="hero-metrics"><div><div class="hero-metric-label">Disponible ce mois</div><div class="hero-metric-number">${money(delta)}</div></div><div><div class="hero-metric-label">Échéances à venir</div><div class="hero-metric-number">${next.length}</div></div></div><div class="hero-visual">${spanChart(computeTrend(),'#bde58c',false)}</div></div></section><div class="side-stack"><div class="card metric-card"><div><div class="metric-title">Entrées ce mois</div><div class="metric-value positive-money">+ ${money(inc)}</div><div class="metric-hint">Hors virements internes</div></div><div class="metric-icon income">${ico('download')}</div></div><div class="card metric-card"><div><div class="metric-title">Sorties ce mois</div><div class="metric-value">− ${money(out)}</div><div class="metric-hint">Hors virements internes</div></div><div class="metric-icon expense">${ico('upload')}</div></div></div></div><div class="grid-2"><section class="card card-pad"><div class="section-header"><h2>Dernières opérations</h2><button class="section-link" data-view="transactions">Tout voir ${ico('arrow-right')}</button></div>${txns.length?`<div class="transactions-list">${txns.map(t=>rowTransaction(t,false)).join('')}</div>`:'<div class="empty">Vos opérations apparaîtront ici.</div>'}</section><section class="card card-pad"><div class="section-header"><h2>Répartition des dépenses</h2><span class="sub">${h(fmtMonth.format(fromDay(currentMonth()+'-01')))}</span></div>${cats.length?cats.map(([cat,value])=>`<div class="category-row">${categoryIcon(cat)}<div class="category-name">${h(cat)}<div class="category-progress"><div style="width:${Math.max(2,pct(value,max))}%;background:${CATEGORIES[cat]?.bar||'#a6b6c7'}"></div></div></div><div class="category-sum money-val">${money(value)}</div></div>`).join(''):'<div class="empty">Aucune dépense ce mois.</div>'}<div style="margin-top:18px">${btn('Gérer mes budgets','go-budgets','btn-light','chart')}</div></section></div>${db.demo?`<div class="info-panel mt-20">${ico('spark')}<div><strong>Vous explorez une démonstration</strong>Les comptes, les transactions et les soldes affichés sont fictifs. Pour passer à votre budget, <button class="btn-plain" data-action="clear-demo">commencez avec vos propres données</button>.</div></div>`:''}`}
function renderTransactions(){const actions=`${btn('Importer un relevé','import-bank','btn-light','upload')}${btn('Ajouter','add-transaction','btn-dark','plus')}`;return `${header('Mes opérations','Toutes les transactions, avec recherche, filtres et pointage.',actions,'HISTORIQUE BANCAIRE')}<div class="transactions-toolbar"><div class="search-input">${ico('search')}<input id="search-operations" placeholder="Rechercher un libellé, un montant…" value="${h(search)}" /></div><select id="filter-account" class="filter-select" aria-label="Filtrer par compte"><option value="all">Tous les comptes</option>${db.accounts.map(a=>`<option value="${h(a.id)}" ${accountFilter===a.id?'selected':''}>${h(a.name)}</option>`).join('')}</select><select id="filter-category" class="filter-select" aria-label="Filtrer par catégorie"><option value="all">Toutes les catégories</option>${Object.keys(CATEGORIES).map(c=>`<option ${catFilter===c?'selected':''}>${h(c)}</option>`).join('')}</select></div><section class="card ops-list"><div id="operation-rows">${filterRows()}</div></section><div class="footnote">Les opérations importées ou synchronisées sont identifiées par leur source. Le pointage est indépendant de la synchronisation bancaire.</div>`}
function filterRows(){return groupedRows([...db.transactions].filter(t=>{const q=search.toLocaleLowerCase('fr').trim();return (accountFilter==='all'||t.accountId===accountFilter)&&(catFilter==='all'||t.category===catFilter||t.splits?.some(s=>s.category===catFilter))&&(!q||[t.merchant,t.notes,t.category,t.amount,accName(t.accountId)].join(' ').toLocaleLowerCase('fr').includes(q))}).sort(dateSort))}
function renderBudgets(){const m=month,items=db.budgets[m]||{},planned=round(Object.values(items).reduce((s,n)=>s+num(n),0)),spent=outgoings(m),left=round(planned-spent),categories=new Set([...Object.keys(items),...byCategory(m).map(x=>x[0])]);const entries=[...categories].filter(c=>EXPENSE_CATS.includes(c)).sort((a,b)=>spentOn(b,m)-spentOn(a,m));const opts=`${monthPicker()}${btn('Définir un budget','set-budget','btn-dark','plus')}`;return `${header('Budgets','Suivez les écarts entre dépenses réelles et objectifs.',opts,'PLANIFICATION MENSUELLE')}<div class="budget-overview"><div class="card budget-stat"><small>Budget prévu</small><strong>${money(planned)}</strong></div><div class="card budget-stat"><small>Réalisé</small><strong>${money(spent)}</strong></div><div class="card budget-stat"><small>${left>=0?'Reste disponible':'Dépassement'}</small><strong class="${left>=0?'accent':'text-danger'}">${money(Math.abs(left))}</strong></div></div><section class="card card-pad"><div class="section-header"><h2>Budget par catégorie</h2><span class="sub">${entries.length} catégorie${entries.length>1?'s':''}</span></div>${entries.length?`<div class="budget-list">${entries.map(c=>{const goal=num(items[c]),used=spentOn(c,m),percentage=pct(used,goal),over=goal>0&&used>goal;return `<div class="budget-tile"><div class="budget-tile-head">${categoryIcon(c)}<div class="budget-tile-label">${h(c)}</div><button class="txn-action" data-action="budget-category" data-category="${h(c)}" title="Modifier le budget">${ico('edit')}</button></div><div class="budget-tile-main"><strong>${money(used)}</strong><small>sur ${money(goal)} ${notify(over)}</small></div><div class="category-progress" style="height:8px"><div style="width:${goal?Math.min(100,percentage):0}%;background:${over?'#e78388':CATEGORIES[c]?.bar||'#9badba'}"></div></div><div class="budget-tile-foot"><span>${goal?pct(used,goal)+' % utilisés':'Aucun objectif défini'}</span><span>${goal?money(Math.abs(goal-used))+(over?' de dépassement':' function saveTransaction(form){let fd=new FormData(form),t=modal.id?db.transactions.find(t=>t.id===modal.id):null;const isSync=t?.source==='bridge';let amount=Number(fd.get('amount'));if(isSync)amount=Math.abs(t.amount);const error=byId('form-error');error.textContent='';if(!Number.isFinite(amount)||amount<=0||amount>1e11){error.textContent='Indiquez un montant positif valide.';return}let date=isSync?t.date:String(fd.get('date')),accountId=isSync?t.accountId:String(fd.get('accountId'));if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!db.accounts.some(a=>a.id===accountId)){error.textContent='Date ou compte invalide.';return}let merchant=String(fd.get('merchant')||'').trim().slice(0,160),notes=String(fd.get('notes')||'').trim().slice(0,300);if(!merchant){error.textContent='Indiquez le libellé.';return}const kind=modal.kind,category=kind==='transfer'?'Virement':String(fd.get('category')),signed=round(kind==='income'?amount:-amount);let splits=[];if(kind==='expense'){const cats=fd.getAll('splitCategory'),amounts=fd.getAll('splitAmount');if(cats.length){splits=cats.map((cat,i)=>({category:String(cat),amount:round(Number(amounts[i]))}));if(splits.some(s=>!EXPENSE_CATS.includes(s.category)||!Number.isFinite(s.amount)||s.amount<=0)||Math.abs(splits.reduce((s,x)=>s+x.amount,0)-amount)>.01){error.textContent='La somme des ventilations doit être égale au montant total.';return}}}if(kind==='transfer'){const toAccountId=String(fd.get('toAccountId'));if(!db.accounts.some(a=>a.id===toAccountId)||toAccountId===accountId){error.textContent='Choisissez deux comptes distincts.';return}if(t&&t.linkedTransfer)db.transactions=db.transactions.filter(x=>x.linkedTransfer!==t.linkedTransfer);const link=uid();db.transactions.push({id:uid(),accountId,toAccountId,date,amount:-amount,merchant,notes,category:'Virement',source:'manual',reconciled:false,splits:[],linkedTransfer:link},{id:uid(),accountId:toAccountId,toAccountId:accountId,date,amount,merchant:`Reçu de ${accName(accountId)}`,notes,category:'Virement',source:'manual',reconciled:false,splits:[],linkedTransfer:link})}else if(t){Object.assign(t,{date,accountId,amount:isSync?t.amount:signed,merchant,notes,category,splits});}else db.transactions.push({id:uid(),date,accountId,amount:signed,merchant,notes,category,splits,source:'manual',reconciled:false});persist();closeModal();render();toast(t?'Opération modifiée.':'Opération enregistrée.')}
function removeTransaction(id){const t=db.transactions.find(t=>t.id===id);if(!t||t.source==='bridge'){toast('Cette transaction synchronisée ne peut pas être supprimée.',true);return}if(!confirm(`Supprimer « ${t.merchant} »${t.linkedTransfer?' et sa contrepartie':''} ?`))return;db.transactions=db.transactions.filter(x=>x.id!==id&&(!t.linkedTransfer||x.linkedTransfer!==t.linkedTransfer));persist();closeModal();render();toast('Opération supprimée.')}

async function loginBank(form){const pw=String(new FormData(form).get('password')||'');if(!pw)return;const button=form.querySelector('button[type=submit]');button.disabled=true;try{await api('/api/bank/login',{method:'POST',body:JSON.stringify({password:pw})});await readBankStatus();if(bankState.connected){closeModal();await syncBank()}else{bankModal();toast('Module bancaire déverrouillé.')}}catch(err){toast('Authentification refusée : '+err.message,true);button.disabled=false}}
async function connectBank(){try{toast('Préparation du parcours sécurisé Société Générale…');const {url}=await api('/api/bank/connect',{method:'POST',body:'{}'});const dest=new URL(url);if(dest.protocol!=='https:'||!(dest.hostname==='enablebanking.com'||dest.hostname.endsWith('.enablebanking.com')))throw Error('URL de consentement non autorisée');window.location.assign(dest.href)}catch(err){toast('Connexion Société Générale : '+err.message,true)}}
function inferCategory(merchant,amount){if(amount>0)return 'Revenus';const s=merchant.toUpperCase();if(/CARREFOUR|AUCHAN|INTERMARCHE|LECLERC|LIDL|ALDI|SUPER U|MONOPRIX|PICARD|CASINO/.test(s))return 'Alimentation';if(/SNCF|SHELL|TOTAL|ESSO|BP |AUTOROUTE|UBER|BOLT|TAXI|METRO|PARKING/.test(s))return 'Transport';if(/NETFLIX|SPOTIFY|DISNEY|APPLE\.COM|FREE MOBILE|SFR|BOUYGUES|ORANGE/.test(s))return 'Abonnements';if(/EDF|ENGIE|LOYER|GAZ|EAU|SYNDIC/.test(s))return 'Logement';if(/PHARMAC|DOCTEUR|DENT|SANTE|MUTUELLE/.test(s))return 'Santé';if(/RESTAURANT|CAFE|CINEMA|BOWLING|HOTEL/.test(s))return 'Loisirs';return 'Autres'}
function importEnableBankingData(payload){if(!Array.isArray(payload.accounts)||!Array.isArray(payload.transactions))throw Error('Réponse bancaire non reconnue');let addedAccounts=0,addedTx=0,updatedTx=0,deletedTx=0;const ts=isoDay();for(const r of payload.accounts){if(r.currency_code!=='EUR')continue;const remote=String(r.id);let a=db.accounts.find(a=>a.enableAccountId===remote);const value={name:String(r.name||'Compte bancaire').slice(0,100),type:String(r.type||'checking'),bank:'Société Générale',balance:round(num(r.balance)),currency:'EUR',manual:false,enableAccountId:remote,updatedAt:r.updated_at||ts};if(a)Object.assign(a,value);else {a={id:uid(),color:'#b1daca',...value};db.accounts.push(a);addedAccounts++}}
for(const r of payload.transactions){const a=db.accounts.find(a=>a.enableAccountId===String(r.account_id));if(!a||r.future)continue;const ref=String(r.id);if(r.deleted){const before=db.transactions.length;db.transactions=db.transactions.filter(t=>t.enableTransactionId!==ref);deletedTx+=before-db.transactions.length;continue}const merchant=String(r.clean_description||r.provider_description||'Opération bancaire').slice(0,160),value=round(num(r.amount)),date=String(r.date||'').slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(date))continue;let t=db.transactions.find(t=>t.enableTransactionId===ref);if(t){if(t.amount!==value)t.splits=[];Object.assign(t,{accountId:a.id,date,amount:value,enableTransactionId:ref,source:'enablebanking'});updatedTx++}else{db.transactions.push({id:uid(),accountId:a.id,date,amount:value,merchant,category:inferCategory(merchant,value),notes:'',source:'enablebanking',enableTransactionId:ref,reconciled:false,splits:[]});addedTx++}}
if(payload.accounts.length){db.demo=false}persist();return {addedAccounts,addedTx,updatedTx,deletedTx}}
async function syncBank(){try{toast('Synchronisation Enable Banking en cours…');const data=await api('/api/bank/sync',{method:'POST',body:'{}'});if(db.demo&&data.accounts?.length){if(!confirm('La synchronisation va remplacer les comptes, budgets et opérations fictifs de démonstration. Continuer ?'))return;db={version:1,demo:false,accounts:[],transactions:[],budgets:{},recurring:[],settings:{hidden:false},imported:[]}}const result=importEnableBankingData(data);closeModal();navigate('accounts');toast(`${result.addedAccounts} compte(s) · ${result.addedTx} nouvelle(s) opération(s) · ${result.updatedTx} mise(s) à jour.`)}catch(err){toast('Synchronisation impossible : '+err.message,true)}}
async function disconnectBank(){if(!confirm('Révoquer le consentement bancaire Société Générale et supprimer leurs données synchronisées de cet appareil ? Cette action est irréversible.'))return;try{await api('/api/bank/disconnect',{method:'POST',body:'{}'});const bankIds=new Set(db.accounts.filter(a=>a.manual===false).map(a=>a.id));db.transactions=db.transactions.filter(t=>!bankIds.has(t.accountId));db.accounts=db.accounts.filter(a=>a.manual!==false);db.recurring=db.recurring.filter(r=>!bankIds.has(r.accountId));persist();closeModal();navigate('accounts');toast('Accès Enable Banking révoqué et données bancaires locales supprimées.')}catch(err){toast('Révocation impossible : '+err.message,true)}}
async function logoutBank(){try{await api('/api/bank/logout',{method:'POST',body:'{}'});await readBankStatus();bankModal();toast('Session bancaire fermée.')}catch(err){toast(err.message,true)}}
// --- Import/export CSV, QIF, OFX, JSON. Aucun fichier envoyé vers un serveur. ---
function downloadFile(name,content,mime){const u=URL.createObjectURL(new Blob([content],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}
function exportJson(){downloadFile('cadran-sauvegarde-'+isoDay()+'.json',JSON.stringify({...db,exportDate:new Date().toISOString()},null,2),'application/json');toast('Sauvegarde JSON téléchargée.')}
function safeCell(s){let x=String(s??'');if(/^[\s]*[=+@\-]/.test(x)&&/[A-Za-z=+@]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'}
function exportCsv(){const head=['Date','Compte','Libellé','Montant','Catégorie','Note','Pointée','Source'];const rows=db.transactions.sort(dateSort).map(t=>[t.date,accName(t.accountId),t.merchant,t.amount.toFixed(2),t.category,t.notes,t.reconciled?'Oui':'Non',t.source]);const out=[head,...rows].map(a=>a.map(safeCell).join(';')).join('\r\n');downloadFile('cadran-operations-'+isoDay()+'.csv','\ufeff'+out,'text/csv;charset=utf-8');toast('Export CSV créé.')}
function parseCSV(src){const text=src.replace(/^\ufeff/,'').replace(/\r\n?/g,'\n'),first=text.slice(0,500).split('\n')[0]||'',delimiter=[';',',','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0]||';';const all=[];let cell='',row=[],quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===delimiter&&!quote){row.push(cell);cell=''}else if(c==='\n'&&!quote){row.push(cell);if(row.some(x=>x.trim()))all.push(row);row=[];cell=''}else cell+=c;}row.push(cell);if(row.some(x=>x.trim()))all.push(row);if(!all.length)return[];const headers=all[0].map(c=>c.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));const find=(...parts)=>headers.findIndex(x=>parts.some(p=>x===p||x.includes(p)));let di=find('date','date comptable','date operation'),ai=find('montant','amount'),debi=find('debit'),credi=find('credit'),li=find('libelle','description','tiers','merchant','designation','intitule'),ci=find('categorie','category'),ni=find('note','memo');if(di<0||li<0||(ai<0&&(debi<0||credi<0)))throw Error('En-têtes non reconnus. Colonnes requises : Date, Libellé et Montant (ou Débit/Crédit).');return all.slice(1).map(cols=>{const amount=ai>=0?parseAmount(cols[ai]):round(parseAmount(cols[credi]||'0')-Math.abs(parseAmount(cols[debi]||'0')));return {date:parseDate(cols[di]),merchant:(cols[li]||'').trim(),amount,category:cols[ci]&&CATEGORIES[cols[ci].trim()]?cols[ci].trim():null,notes:(cols[ni]||'').trim()}}).filter(x=>x.date&&x.merchant&&Number.isFinite(x.amount)&&x.amount!==0)}
function parseAmount(x){let s=String(x||'0').replace(/\u00a0/g,'').replace(/\s/g,'').replace(/[€$]/g,'').replace(/\((.*)\)/,'-$1');if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}else if(s.includes(','))s=s.replace(',','.');return Number(s)}
function parseDate(x){let s=String(x||'').trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);let m=s.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})/);if(m){let y=Number(m[3]);if(y<100)y+=y>=75?1900:2000;const d=`${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;return isNaN(fromDay(d).getTime())?null:d}if(/^\d{8}/.test(s)){const d=`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;return isNaN(fromDay(d).getTime())?null:d}return null}
function parseQIF(text){const entries=text.split('^');return entries.map(section=>{const vals={};for(const line of section.split(/\r?\n/)){const k=line.slice(0,1);if('DTPML'.includes(k)&&k.length)vals[k]=line.slice(1).trim()}return{date:parseDate(vals.D),merchant:vals.P||vals.M||'',amount:parseAmount(vals.T),category:CATEGORIES[vals.L]?vals.L:null,notes:vals.M||''}}).filter(x=>x.date&&x.merchant&&x.amount&&Number.isFinite(x.amount))}
function parseOFX(text){const blocks=text.match(/<STMTTRN>[\s\S]*?(?:<\/STMTTRN>|(?=<STMTTRN>)|$)/gi)||[];const get=(text,tag)=>{const m=text.match(new RegExp(`<${tag}>([^<\\r\\n]+)`,'i'));return m?.[1]?.trim()||''};return blocks.map(b=>({date:parseDate(get(b,'DTPOSTED')),merchant:get(b,'NAME')||get(b,'MEMO')||'Opération bancaire',amount:parseAmount(get(b,'TRNAMT')),notes:get(b,'MEMO'),remoteId:get(b,'FITID')})).filter(x=>x.date&&Number.isFinite(x.amount)&&x.amount!==0)}
function openImport(){if(!hasAccount())return;byId('csv-picker').value='';byId('csv-picker').click()}
async function processImportFile(file,type){if(file.size>4e6)throw Error('Fichier trop volumineux (4 Mo maximum).');const raw=await file.text();if(type==='json'){let parsed;try{parsed=JSON.parse(raw)}catch(e){throw Error('JSON invalide.')};if(!parsed||!Array.isArray(parsed.accounts)||!Array.isArray(parsed.transactions)||!Array.isArray(parsed.recurring)||!parsed.budgets||!parsed.settings)throw Error('Le fichier n’est pas une sauvegarde Cadran valide.');if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;db={...parsed,version:1};persist();closeModal();render();toast('Sauvegarde restaurée.');return}
const ext=file.name.toLowerCase().split('.').at(-1);const list=ext==='qif'?parseQIF(raw):ext==='ofx'?parseOFX(raw):parseCSV(raw);if(!list.length)throw Error('Aucune opération exploitable détectée.');if(list.length>10000)throw Error('Import limité à 10 000 opérations.');importDraft={list,ext};modal={type:'import'};const preview=list.slice(0,8).map(t=>`<tr><td>${formatDate(t.date)}</td><td>${h(t.merchant)}</td><td>${money(t.amount)}</td></tr>`).join('');openModal(`Importer ${list.length} opération(s)`,'Vérifiez le compte destinataire avant validation.',`<form id="modal-form" data-form="import"><div class="stack-18">${accountSelect('accountId',db.accounts[0].id)}<div class="notice">Format ${h(ext.toUpperCase())}. Les opérations portant exactement la même date, le même libellé et le même montant sur ce compte sont ignorées à l’import.</div><div class="import-preview"><table><thead><tr><th>Date</th><th>Libellé</th><th>Montant</th></tr></thead><tbody>${preview}</tbody></table></div><label style="font-size:12px;display:flex;gap:9px;align-items:center"><input type="checkbox" name="allowDuplicates" style="width:17px;height:17px"> Autoriser aussi les doublons</label></div><div class="form-foot"><button class="btn btn-light" data-action="close-modal" type="button">Annuler</button><button class="btn btn-dark" type="submit">${ico('upload')} Importer</button></div></form>`)}
function saveImport(form){if(!importDraft)return;const fd=new FormData(form),accountId=String(fd.get('accountId')),duplicate=fd.has('allowDuplicates');if(!db.accounts.find(a=>a.id===accountId))return toast('Compte introuvable.',true);let added=0,skipped=0;for(const r of importDraft.list){if(!duplicate&&db.transactions.some(t=>t.accountId===accountId&&t.date===r.date&&round(t.amount)===round(r.amount)&&t.merchant.toLowerCase()===r.merchant.toLowerCase())){skipped++;continue}db.transactions.push({id:uid(),accountId,date:r.date,merchant:r.merchant.slice(0,160),amount:round(r.amount),category:r.category||inferCategory(r.merchant,r.amount),notes:r.notes?.slice(0,300)||'',source:importDraft.ext,reconciled:false,splits:[]});added++}if(added){db.demo=false;persist()}closeModal();render();toast(`${added} opération(s) importée(s), ${skipped} doublon(s) ignoré(s).`)}
function openSettings(){modal={type:'settings'};openModal('Paramètres et données','Export, restauration et confidentialité de votre gestion.',`<div class="settings-list"><button class="settings-item" data-action="bank-module">${ico('bank')}<div class="settings-text"><strong>Connexion bancaire · Société Générale</strong><small>Déverrouiller, connecter et synchroniser mes comptes via Enable Banking.</small></div>${ico('arrow-right')}</button><button class="settings-item" data-action="export-json">${ico('download')}<div class="settings-text"><strong>Sauvegarder toutes mes données</strong><small>Exporter un fichier JSON complet, restaurable.</small></div>${ico('arrow-right')}</button><button class="settings-item" data-action="restore-json">${ico('upload')}<div class="settings-text"><strong>Restaurer une sauvegarde</strong><small>Importer un fichier JSON Cadran.</small></div>${ico('arrow-right')}</button><button class="settings-item" data-action="export-csv">${ico('download')}<div class="settings-text"><strong>Exporter mes opérations</strong><small>Fichier CSV compatible tableurs.</small></div>${ico('arrow-right')}</button><button class="settings-item" data-action="import-bank">${ico('upload')}<div class="settings-text"><strong>Importer un relevé bancaire</strong><small>CSV, QIF, OFX : import et contrôle des doublons.</small></div>${ico('arrow-right')}</button><button class="settings-item" data-action="toggle-hide">${ico('eye')}<div class="settings-text"><strong>Masquer les montants</strong><small>Flouter rapidement les soldes à l’écran.</small></div>${ico('arrow-right')}</button><button class="settings-item" data-action="clear-demo">${ico('wallet')}<div class="settings-text"><strong>Commencer avec mes comptes</strong><small>Effacer les exemples fictifs et repartir à zéro.</small></div>${ico('arrow-right')}</button><button class="settings-item" data-action="reset-data">${ico('trash')}<div class="settings-text"><strong class="text-danger">Effacer mes données locales</strong><small>Suppression irréversible sans sauvegarde.</small></div>${ico('arrow-right')}</button></div><div class="notice mt-20"><strong>Confidentialité</strong>Les données de gestion sont enregistrées dans le stockage de ce navigateur, sur cet appareil. Elles ne sont ni chiffrées localement ni synchronisées entre appareils. N’utilisez pas un appareil partagé sans protection.</div>`)}
function clearDemo(){if(!confirm('Effacer les données de démonstration et commencer avec des comptes vides ? Vos données actuelles seront remplacées.'))return;db={version:1,demo:false,accounts:[],transactions:[],budgets:{},recurring:[],settings:{hidden:false},imported:[]};month=currentMonth();persist();closeModal();navigate('accounts');toast('Espace personnel vide, prêt à configurer.')}

ase 'restore-json':byId('json-picker').value='';byId('json-picker').click();break;case 'import-bank':openImport();break;case 'clear-demo':clearDemo();break;case 'reset-data':resetData();break;}}
);

render();readBankStatus().then(()=>{if(view==='accounts')render()});if(new URLSearchParams(location.search).has('bank_callback')){const params=new URLSearchParams(location.search),ok=params.get('bank_callback')==='1';const url=new URL(location.href);url.searchParams.delete('bank_callback');history.replaceState({},'',url.pathname+url.search+url.hash);navigate('accounts');toast(ok?'Consentement Société Générale reçu. Synchronisation initiale en cours…':'Consentement SG non validé ou session expirée.',!ok);if(ok){readBankStatus().then(status=>{if(status.authenticated&&status.connected)syncBank()}).catch(()=>{})}}
